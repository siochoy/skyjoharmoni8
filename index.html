<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skyjo Tournament Tracker</title>
<!--
  ============================================================
  FIREBASE SETUP — required for live scheduling & invites
  ============================================================
  1. Go to https://console.firebase.google.com → Create a project (free).
  2. In the project, click "Firestore Database" → Create database →
     start in PRODUCTION mode → pick any location.
  3. In Firestore → Rules tab, paste this and click Publish:

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /tournaments/{tid} {
             allow read, write: if true;
             match /rsvps/{rid} {
               allow read, write: if true;
             }
           }
         }
       }

     (This keeps it open so friends can RSVP without logging in —
     fine for a casual scorekeeping app, not for sensitive data.
     Host access is gated by a PIN entered in the app, checked
     client-side — good enough to stop friends from fumbling into
     host controls, not resistant to someone deliberately bypassing
     it via browser dev tools.)

  4. In Project settings (gear icon) → General → scroll to "Your apps"
     → click the web icon (</>) → register an app (nickname anything,
     skip hosting) → copy the firebaseConfig object it shows you.

  5. Replace the placeholder object right below this comment with
     the one you copied, then commit/save this file. Done — reload
     the page and scheduling + live invites will be enabled.
  ============================================================
-->
<script>
  window.FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY_HERE",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "000000000000",
    appId: "YOUR_APP_ID"
  };
</script>
<style>
body { font-family: 'Manrope', system-ui, -apple-system, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; cursor: pointer; border: none; }
input, select { font: inherit; }
table { border-collapse: separate; }

@keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.skyjo-pop { animation: popIn 0.25s ease-out; }
.skyjo-bob { animation: bob 2.2s ease-in-out infinite; }
.skyjo-scroll::-webkit-scrollbar { height: 8px; width: 8px; }

.skyjo-scroll::-webkit-scrollbar-track { background: transparent; }
